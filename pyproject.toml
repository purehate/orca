[project]
name = "orca"
dynamic = ["version"]
description = "Odoo Recon & Configuration Analyzer — unauthenticated frontend security scanner"
authors = [{ name = "Martin Bos" }]
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "requests>=2.25,<3",
    "beautifulsoup4>=4.9,<5",
    "rich>=14.0.0"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca"]

[project.scripts]
orca = "orca.cli:main"

[tool.hatch.version]
path = "orca/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["orca"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
